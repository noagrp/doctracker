<title>DocTracker — Invoice & Payment Ledger</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;color:#20313e;background:#eef2f4;font-size:14px}
*{box-sizing:border-box}body{margin:0}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid #d4dfe4;background:white;padding:9px 13px;border-radius:9px;color:#20313e}button:hover{background:#edf5f7}button.primary{background:#176a7d;color:white;border-color:#176a7d}button.danger{color:#ad3434}button:disabled{opacity:.4;cursor:not-allowed}input,select,textarea{width:100%;padding:10px;border:1px solid #cbd9de;border-radius:8px;background:white;color:#20313e}textarea{resize:vertical;min-height:65px}label{display:block;font-size:12px;color:#60717d;margin:0 0 5px}.app{min-height:100vh;display:grid;grid-template-columns:218px minmax(0,1fr)}.sidebar{background:#182c38;color:#ecf4f6;padding:22px 15px;display:flex;flex-direction:column;gap:6px}.brand{display:flex;align-items:center;gap:10px;margin:0 9px 30px;font-size:21px;font-weight:750}.navs{display:flex;flex-direction:column;gap:4px;min-width:0}.nav{display:block;width:100%;flex:0 0 auto;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:0;background:transparent;color:#a8bec9;text-align:left;padding:12px 14px;border-radius:9px}.nav.active,.nav:hover{background:#2d4b5a;color:white}.sidebottom{margin-top:auto;padding:16px 9px;color:#b4cad3;font-size:12px}.meter{height:7px;background:#47606c;border-radius:9px;overflow:hidden;margin-top:8px}.meter>div{height:100%;background:#67c5b5;width:0;transition:width .2s}.main{padding:27px;min-width:0;max-width:1500px;width:100%;margin:auto}.top{display:flex;justify-content:space-between;align-items:center;gap:15px;margin-bottom:24px;flex-wrap:wrap}h1{font-size:27px;letter-spacing:-.7px;margin:0}h2{font-size:17px;margin:0 0 15px}.sub{color:#6a7e89;font-size:13px;margin:6px 0}.actions{display:flex;gap:8px;flex-wrap:wrap}.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card,.panel{background:white;border:1px solid #dee6e9;border-radius:14px;padding:18px;box-shadow:0 3px 13px #0b273309}.card .number{font-size:25px;font-weight:750;margin-top:12px;overflow-wrap:anywhere}.card small{color:#66808e}.panel{margin-bottom:17px;overflow:auto}.filters{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:14px}.filters input,.filters select{width:auto;min-width:160px}.tablewrap{width:100%;overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px}th{text-align:left;color:#647a86;background:#f4f7f8;font-weight:600}td,th{padding:12px 11px;border-bottom:1px solid #e8eef0;white-space:nowrap}td.right,th.right{text-align:right}tr:hover td{background:#fafcfc}.pill{display:inline-block;padding:4px 9px;border-radius:40px;font-size:11px;font-weight:700;background:#eaf1f5;color:#496170}.pill.paid{background:#e6f6ef;color:#147750}.pill.partial{background:#fff2db;color:#94631a}.pill.overdue{background:#ffe8e6;color:#a82d30}.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px}.field{margin-bottom:13px}.muted{color:#718593}.empty{text-align:center;padding:35px;color:#758994}.form-actions{display:flex;gap:9px;justify-content:flex-end;margin-top:18px}.modal-back{position:fixed;inset:0;z-index:20;background:#0e22349c;display:flex;align-items:center;justify-content:center;padding:17px}.modal{background:#fff;width:min(680px,100%);max-height:92vh;overflow:auto;border-radius:15px;padding:24px;box-shadow:0 20px 60px #0004}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.modal-head h2{margin:0}.checkrow{display:flex;align-items:center;gap:8px;margin:9px 0}.checkrow input{width:auto}.notice{padding:12px 14px;border:1px solid #d7e6eb;border-radius:9px;background:#f4fafb;color:#486779;margin-bottom:15px}.dangerbox{background:#fff6f4;border-color:#f0d5d0;color:#8c4c43}.stack{display:flex;flex-direction:column;gap:10px}.bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.linkbtn{padding:4px 6px;border:0;color:#176a7d;background:none}.small{font-size:12px}.spacer{flex:1}#toast{position:fixed;right:20px;bottom:20px;background:#203947;color:#fff;padding:12px 18px;border-radius:10px;box-shadow:0 10px 30px #0003;z-index:50;display:none}.print-only{display:none}
@media(max-width:900px){.cards{grid-template-columns:repeat(2,1fr)}.app{grid-template-columns:1fr}.sidebar{padding:12px;display:block;min-width:0}.brand{margin:0 0 12px}.navs{display:flex;flex-direction:row;overflow-x:auto;overflow-y:hidden;gap:5px;scrollbar-width:thin;overscroll-behavior-x:contain;-webkit-overflow-scrolling:touch;padding-bottom:5px}.nav{width:auto;flex:0 0 auto;overflow:visible;text-overflow:clip;padding:10px 13px}.sidebottom{margin:10px 8px 0;max-width:230px}.main{padding:17px}.grid2{grid-template-columns:1fr}}
@media(max-width:520px){.top{align-items:flex-start}.top .actions{width:100%}.main{padding:12px}.panel{padding:13px}.cards{gap:8px}.card{padding:13px}.card .number{font-size:19px}.filters input,.filters select{flex:1;width:100%;min-width:0}}
.company-field-row{display:grid;grid-template-columns:minmax(120px,1fr) minmax(200px,2fr) auto;gap:12px;align-items:start;padding:12px 0;border-bottom:1px solid #e8eef0}.company-field-row .actions{flex-wrap:nowrap}.report-preview{padding:24px;background:#fff;border:1px solid #e0e6e9;border-radius:9px}.company-header{text-align:center;color:#111;line-height:1.45}.company-name{font-family:Georgia,serif;font-size:19px;font-weight:700}.company-detail{font-family:Georgia,serif;font-size:13px}.report-period{text-align:center;font-weight:600;margin:16px 0}@media(max-width:600px){.company-field-row{grid-template-columns:1fr;gap:4px}.company-field-row .field{margin-bottom:5px}.report-preview{padding:15px}}@media print{body{background:white;color:black}.sidebar,.actions,.filters,.form-actions,.noprint,#toast{display:none!important}.app{display:block}.main{padding:0}.panel,.card{box-shadow:none;border:0}.print-only{display:block}.company-header{margin:0 auto 20px}.company-name{font-size:18px}.company-detail{font-size:12px}.cards{grid-template-columns:repeat(4,1fr)}.tablewrap{overflow:visible}table{font-size:10px}tr{break-inside:avoid}h1{font-size:23px}@page{size:A4 landscape;margin:13mm}}
</style></head>
<body><div class="app"><aside class="sidebar"><div class="brand">DocTracker</div><div class="navs" id="navs"></div><div class="sidebottom"><div class="bar"><span>Local data usage</span><b id="percent">0%</b></div><div class="meter"><div id="meterfill"></div></div><div style="margin-top:9px">Stored on this device · Back up regularly</div></div></aside><main class="main" id="app"></main></div><div id="overlay"></div><div id="toast"></div><input id="file" type="file" accept=".json,application/json" hidden>
<script>
"use strict";
const LIMIT=4.5*1024*1024, DB="doctracker-db", KEY="ledger", VERSION=1;
const blank=()=>({schema:VERSION,profile:{name:"",registration:"",address:"",phone:"",email:"",currency:"MYR",yearStart:"01"},businesses:[],invoices:[],payments:[],adjustments:[],archives:[]});
let state=blank(),view="dashboard",search="",direction="all",period=new Date().toISOString().slice(0,7),reportKind="invoice",db=null,editing=null,saveQueue=Promise.resolve();
const $=id=>document.getElementById(id), val=id=>$(id)?.value.trim()||"", id=()=>crypto.randomUUID(), esc=v=>String(v??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const cents=v=>Math.round(Number(v||0)*100),fmt=v=>new Intl.NumberFormat("en-MY",{style:"currency",currency:state.profile.currency||"MYR"}).format(v/100);
const dt=v=>v?new Date(v+"T12:00:00").toLocaleDateString("en-GB"):"—";
const today=()=>new Date().toLocaleDateString("en-CA");const month=v=>String(v||"").slice(0,7);
const biz=id=>state.businesses.find(x=>x.id===id),iname=x=>biz(x.businessId)?.name||x.businessName||"Unknown";
const paid=inv=>state.payments.filter(x=>x.allocations.some(a=>a.invoiceId===inv.id)).reduce((s,p)=>s+p.allocations.filter(a=>a.invoiceId===inv.id).reduce((t,a)=>t+a.amount,0),0);
const adj=inv=>state.adjustments.filter(a=>a.invoiceId===inv.id).reduce((s,a)=>s+(a.kind==="DN"?a.amount:-a.amount),0);
const total=inv=>inv.amount+adj(inv),due=inv=>total(inv)-paid(inv);
const status=inv=>due(inv)<=0?"Paid":paid(inv)>0?"Partial":inv.dueDate&&inv.dueDate<today()?"Overdue":"Unpaid";
const recordsBytes=s=>new TextEncoder().encode(JSON.stringify(s)).length;
const used=()=>recordsBytes(state),usage=()=>Math.min(100,Math.round(100*used()/LIMIT));
function notify(t){$("toast").textContent=t;$("toast").style.display="block";clearTimeout(notify.t);notify.t=setTimeout(()=>$("toast").style.display="none",3500)}
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open(DB,1);r.onupgradeneeded=()=>r.result.createObjectStore("data");r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function readDB(){return new Promise((resolve,reject)=>{let t=db.transaction("data","readonly").objectStore("data").get(KEY);t.onsuccess=()=>resolve(t.result);t.onerror=()=>reject(t.error)})}
function writeDB(obj){return new Promise((resolve,reject)=>{const t=db.transaction("data","readwrite");t.objectStore("data").put(obj,KEY);t.oncomplete=resolve;t.onerror=()=>reject(t.error);t.onabort=()=>reject(t.error)})}
async function commit(next){if(recordsBytes(next)>LIMIT)throw Error("Local data capacity reached. Back up and archive completed invoices to free space.");await (saveQueue=saveQueue.catch(()=>{}).then(()=>writeDB(next)));state=next;render()}
async function change(fn){try{const next=structuredClone(state);fn(next);await commit(next);notify("Saved locally")}catch(e){alert("Not saved: "+e.message)}}
function nav(v){view=v;search="";render()}
const navNames=[["dashboard","Dashboard"],["invoices","Invoices"],["payments","Payments"],["businesses","Businesses"],["reports","Reports"],["data","Data & Archive"],["settings","Settings"]];
function render(){document.title="DocTracker — "+(navNames.find(n=>n[0]===view)?.[1]||"Ledger");$("navs").innerHTML=navNames.map(n=>'<button class="nav '+(view===n[0]?"active":"")+'" data-nav="'+n[0]+'">'+n[1]+'</button>').join("");document.querySelectorAll("[data-nav]").forEach(x=>x.onclick=()=>nav(x.dataset.nav));$("percent").textContent=usage()+"%";$("meterfill").style.width=usage()+"%";$("app").innerHTML=({dashboard:dashboard,invoices:invoices,payments:payments,businesses:businesses,reports:reports,data:dataPage,settings:settings})[view]();bind()}
const head=(title,sub,buttons="")=>'<div class="top"><div><h1>'+title+'</h1><p class="sub">'+sub+'</p></div><div class="actions noprint">'+buttons+'</div></div>';
const btn=(title,action,primary=false)=>'<button '+(primary?'class="primary" ':'')+'data-act="'+action+'">'+title+'</button>';
const pill=i=>'<span class="pill '+status(i).toLowerCase()+'">'+status(i)+'</span>';
function dashboard(){let sales=state.invoices.filter(x=>x.type==="outgoing"),buys=state.invoices.filter(x=>x.type==="incoming");
const card=(name,note,v)=>'<div class="card"><small>'+name+'</small><div class="number">'+fmt(v)+'</div><small>'+note+'</small></div>';
return head("Overview","Your local invoice and payment ledger",btn("New Invoice","newInvoice",true)+btn("Backup Now","backup"))+
'<div class="cards">'+card("Customer receivables","Outstanding",sales.reduce((s,x)=>s+Math.max(0,due(x)),0))+card("Supplier payables","Outstanding",buys.reduce((s,x)=>s+Math.max(0,due(x)),0))+card("Payments received","All time",state.payments.filter(x=>x.type==="incoming").reduce((s,x)=>s+x.amount,0))+card("Payments made","All time",state.payments.filter(x=>x.type==="outgoing").reduce((s,x)=>s+x.amount,0))+'</div>'+
'<div class="panel"><div class="bar"><h2>Recent invoices</h2>'+btn("All Invoices","toInvoices")+'</div>'+invoiceTable([...state.invoices].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10))+'</div>';}
function invoiceTable(items){return '<div class="tablewrap"><table><thead><tr><th>Date</th><th>Invoice</th><th>Type</th><th>Business</th><th class="right">Total</th><th class="right">Paid</th><th class="right">Due</th><th>Status</th><th class="noprint"></th></tr></thead><tbody>'+(items.length?items.map(i=>'<tr><td>'+dt(i.date)+'</td><td>'+esc(i.number)+'</td><td>'+(i.type==="incoming"?"Incoming":"Outgoing")+'</td><td>'+esc(iname(i))+'</td><td class="right">'+fmt(total(i))+'</td><td class="right">'+fmt(paid(i))+'</td><td class="right">'+fmt(due(i))+'</td><td>'+pill(i)+'</td><td class="noprint"><button class="linkbtn" data-open="'+i.id+'">Open</button></td></tr>').join(""):'<tr><td colspan="9" class="empty">No invoices yet</td></tr>')+'</tbody></table></div>'}
function invoices(){let items=state.invoices.filter(x=>(direction==="all"||x.type===direction)&&([x.number,iname(x),x.description].join(" ").toLowerCase().includes(search.toLowerCase()))).sort((a,b)=>b.date.localeCompare(a.date));
return head("Invoices","Incoming supplier invoices and outgoing customer invoices",btn("New Invoice","newInvoice",true))+
'<div class="panel"><div class="filters"><input id="search" placeholder="Search invoice or business" value="'+esc(search)+'"><select id="direction"><option value="all">All directions</option><option value="incoming" '+(direction==="incoming"?"selected":"")+'>Incoming · Suppliers</option><option value="outgoing" '+(direction==="outgoing"?"selected":"")+'>Outgoing · Customers</option></select><span class="spacer"></span><span class="muted">'+items.length+' invoices</span></div>'+invoiceTable(items)+'</div>'}
function payments(){let a=[...state.payments].sort((a,b)=>b.date.localeCompare(a.date));return head("Payments","Receipts from customers and payments to suppliers",btn("Record Payment","newPayment",true))+'<div class="panel"><div class="tablewrap"><table><thead><tr><th>Date</th><th>Direction</th><th>Business</th><th>Reference</th><th>Invoice allocations</th><th class="right">Amount</th><th class="noprint"></th></tr></thead><tbody>'+(a.length?a.map(p=>'<tr><td>'+dt(p.date)+'</td><td>'+(p.type==="incoming"?"Received":"Paid out")+'</td><td>'+esc(biz(p.businessId)?.name||"—")+'</td><td>'+esc(p.reference)+'</td><td>'+p.allocations.map(a=>esc(state.invoices.find(i=>i.id===a.invoiceId)?.number||"?")).join(", ")+'</td><td class="right">'+fmt(p.amount)+'</td><td class="noprint"><button class="linkbtn" data-editpay="'+p.id+'">Edit</button></td></tr>').join(""):'<tr><td class="empty" colspan="7">No payments yet</td></tr>')+'</tbody></table></div></div>'}
function businesses(){return head("Businesses","One directory — each business can be a customer, supplier, or both",btn("Add Business","newBusiness",true))+'<div class="panel"><div class="tablewrap"><table><thead><tr><th>Business</th><th>Registration</th><th>Roles</th><th>Contact</th><th class="noprint"></th></tr></thead><tbody>'+(state.businesses.length?state.businesses.map(b=>'<tr><td><b>'+esc(b.name)+'</b></td><td>'+esc(b.registration)+'</td><td>'+[b.customer?"Customer":"",b.supplier?"Supplier":""].filter(Boolean).join(" & ")+'</td><td>'+esc(b.email||b.phone)+'</td><td class="noprint"><button class="linkbtn" data-editbiz="'+b.id+'">Edit</button></td></tr>').join(""):'<tr><td colspan="5" class="empty">Add your first customer or supplier</td></tr>')+'</tbody></table></div></div>'}
function monthly(){const inv=state.invoices.filter(i=>month(i.date)===period);const groups=["outgoing","incoming"].map(t=>{let a=inv.filter(i=>i.type===t);return{type:t,amount:a.reduce((s,i)=>s+total(i),0),paid:a.reduce((s,i)=>s+paid(i),0),due:a.reduce((s,i)=>s+due(i),0)}});return groups}
function reports(){let a=monthly(),pay=state.payments.filter(p=>month(p.date)===period),rows=reportKind==="invoice"?state.invoices.filter(i=>month(i.date)===period):pay;
return head("Reports","Monthly invoice balances and payment activity",btn("Export Excel","excel")+btn("Print / Save PDF","print",true))+
'<div class="panel"><div class="filters"><label>Month <input type="month" id="period" value="'+period+'"></label><label>Report <select id="reportKind"><option value="invoice" '+(reportKind==="invoice"?"selected":"")+'>Invoice summary</option><option value="payment" '+(reportKind==="payment"?"selected":"")+'>Payment activity</option><option value="outstanding" '+(reportKind==="outstanding"?"selected":"")+'>Outstanding register</option></select></label></div><div class="print-only">' + companyHeader(state.profile) + '<p class="report-period">Report period: ' + esc(period) + '</p></div>'+
(reportKind==="invoice"?'<h2>Invoice month: '+esc(period)+'</h2><p class="sub">Payments shown include all payments recorded against these invoices, regardless of payment month.</p><div class="tablewrap"><table><tr><th>Direction</th><th class="right">Invoice total</th><th class="right">Paid</th><th class="right">Outstanding</th></tr>'+a.map(g=>'<tr><td>'+(g.type==="incoming"?"Incoming / Supplier":"Outgoing / Customer")+'</td><td class="right">'+fmt(g.amount)+'</td><td class="right">'+fmt(g.paid)+'</td><td class="right">'+fmt(g.due)+'</td></tr>').join("")+'</table></div>'+invoiceTable(rows):
reportKind==="payment"?'<h2>Payments made or received in '+esc(period)+'</h2><div class="tablewrap"><table><tr><th>Date</th><th>Direction</th><th>Business</th><th>Reference</th><th class="right">Amount</th></tr>'+rows.map(p=>'<tr><td>'+dt(p.date)+'</td><td>'+(p.type==="incoming"?"Received":"Paid out")+'</td><td>'+esc(biz(p.businessId)?.name)+'</td><td>'+esc(p.reference)+'</td><td class="right">'+fmt(p.amount)+'</td></tr>').join("")+'</table></div>':
'<h2>Current outstanding invoices</h2>'+invoiceTable(state.invoices.filter(i=>due(i)>0)))+'</div>'}
function dataPage(){let done=state.invoices.filter(i=>due(i)===0),n=state.invoices.length;return head("Data & Archive","Everything stays in this browser unless you export it",btn("Full Backup","backup",true))+
'<div class="panel"><h2>Local data</h2><div class="notice">Used: <b>'+usage()+'%</b> of the app data budget. Browser data may be cleared or evicted; keep external backups. No automatic cloud synchronization.</div><p>'+n+' invoices · '+state.payments.length+' payments · '+state.businesses.length+' businesses</p><div class="actions">'+btn("Download Backup (.json)","backup")+btn("Restore Backup","restore")+btn("Export Invoices (.json)","exportInvoices")+'</div></div>'+
'<div class="panel"><h2>Archive completed invoices</h2><p class="sub">Only fully settled invoices can be archived. Associated payments and CN/DN adjustments are bundled together. Download and save the archive before removal.</p><p><b>'+done.length+'</b> completed invoices eligible</p><div class="actions">'+btn("Export Completed Archive","archive")+btn("Import Archive","importArchive")+'</div></div>'+
'<div class="panel"><h2>Archive history</h2><p class="sub">Local archive receipts (not the archive files themselves).</p>'+(state.archives.length?state.archives.map(a=>'<p>'+esc(a.date)+' · '+a.count+' invoices · '+esc(a.filename)+'</p>').join(""):'<p class="muted">No archives yet</p>')+'</div>'}
function companyFields(p){return Array.isArray(p.fields)?p.fields:[["Company No.",p.registration],["Address",p.address],["Tel",p.phone],["Email",p.email]].filter(x=>x[1]).map(x=>({label:x[0],value:x[1]}))}
function companyHeader(p){return '<div class="company-header"><div class="company-name">'+esc(p.name||"Company Name")+'</div>'+companyFields(p).filter(f=>f.value?.trim()).map(f=>'<div class="company-detail">'+(f.label?'<strong>'+esc(f.label)+': </strong>':'')+esc(f.value).replace(/\\n/g,"<br>")+'</div>').join("")+'</div>'}
function companyFieldRow(f){return '<div class="company-field-row"><div class="field"><label>Label</label><input class="cf-label" placeholder="Company No." value="'+esc(f.label||"")+'"></div><div class="field"><label>Information</label><textarea class="cf-value" rows="2">'+esc(f.value||"")+'</textarea></div><div class="field"><label>Order</label><div class="actions"><button type="button" data-field-move="up">↑</button><button type="button" data-field-move="down">↓</button><button type="button" data-field-remove>✕</button></div></div></div>'}
function settings(){let p=state.profile;return head("Settings","Company details for every report — flexible fields, no logo")+
'<form id="settingsForm"><div class="panel"><h2>Main Company</h2><div class="grid2"><div class="field"><label>Company name</label><input required name="name" value="'+esc(p.name)+'"></div><div class="field"><label>Report currency</label><input required maxlength="3" name="currency" value="'+esc(p.currency||"MYR")+'"></div></div></div>'+
'<div class="panel"><div class="bar"><h2>Company Header Fields</h2><button type="button" id="addCompanyField">+ Add Field</button></div><p class="sub">Add Registration No., SST, address, telephone, fax, email, website, or any custom field. A blank label creates a standalone line. The display order matches the report.</p><div id="companyFields">'+companyFields(p).map(companyFieldRow).join("")+'</div></div>'+
'<div class="panel"><h2>Report Footer</h2><div class="field"><label>Optional footer text</label><textarea name="footer">'+esc(p.footer||"")+'</textarea></div></div>'+
'<div class="panel"><h2>Report Header Preview</h2><div id="companyPreview" class="report-preview">'+companyHeader(p)+'</div><div class="form-actions"><button class="primary">Save Company Settings</button></div></div></form>'}
function readCompanyForm(){const f=$("settingsForm");return{name:f.elements.name.value.trim(),currency:f.elements.currency.value.trim().toUpperCase(),footer:f.elements.footer.value,fields:[...$("companyFields").children].map(row=>({label:row.querySelector(".cf-label").value.trim(),value:row.querySelector(".cf-value").value.trim()})).filter(x=>x.label||x.value)}}
function setupCompanyForm(){const f=$("settingsForm");if(!f)return;const container=$("companyFields");const preview=()=>{$("companyPreview").innerHTML=companyHeader({...state.profile,...readCompanyForm()})};f.addEventListener("input",preview);$("addCompanyField").onclick=()=>{container.insertAdjacentHTML("beforeend",companyFieldRow({label:"",value:""}));preview()};container.onclick=e=>{const move=e.target.closest("[data-field-move]"),remove=e.target.closest("[data-field-remove]");if(!move&&!remove)return;const row=e.target.closest(".company-field-row");if(remove)row.remove();else if(move.dataset.fieldMove==="up"&&row.previousElementSibling)row.parentNode.insertBefore(row,row.previousElementSibling);else if(move.dataset.fieldMove==="down"&&row.nextElementSibling)row.parentNode.insertBefore(row.nextElementSibling,row);preview()};f.onsubmit=async e=>{e.preventDefault();const p=readCompanyForm();if(!p.name||!/^[A-Z]{3}$/.test(p.currency))return alert("Enter a company name and a 3-letter currency code.");await change(s=>Object.assign(s.profile,p))}}
function modal(title,body){$("overlay").innerHTML='<div class="modal-back"><div class="modal"><div class="modal-head"><h2>'+title+'</h2><button id="closeModal" aria-label="Close">✕</button></div>'+body+'</div></div>';$("closeModal").onclick=closeModal}
function closeModal(){$("overlay").innerHTML="";editing=null}
const field=(name,label,value="",kind="text")=>'<div class="field"><label>'+label+'</label><input name="'+name+'" type="'+kind+'" value="'+esc(value)+'" '+(kind==="number"?'step="0.01" min="0"':'')+'></div>';
function opts(role,selected){return '<option value="">Select business</option>'+state.businesses.filter(b=>b[role]).map(b=>'<option value="'+b.id+'" '+(b.id===selected?"selected":"")+'>'+esc(b.name)+'</option>').join("")}
function businessModal(b){modal(b?"Edit Business":"Add Business",'<form id="businessForm"><div class="grid2">'+field("name","Business name",b?.name)+field("registration","Registration no.",b?.registration)+field("phone","Phone",b?.phone)+field("email","Email",b?.email)+'</div>'+field("address","Address",b?.address)+'<div class="checkrow"><input type="checkbox" name="customer" '+(b?.customer?"checked":"")+'>Customer</div><div class="checkrow"><input type="checkbox" name="supplier" '+(b?.supplier?"checked":"")+'>Supplier</div><div class="form-actions"><button type="button" data-act="close">Cancel</button><button class="primary">Save Business</button></div></form>');$("businessForm").onsubmit=async e=>{e.preventDefault();let f=e.target,o=Object.fromEntries(new FormData(f)),customer=f.customer.checked,supplier=f.supplier.checked;if(!o.name||(!customer&&!supplier))return alert("Enter a name and select at least one role.");await change(s=>{let x={id:b?.id||id(),name:o.name,registration:o.registration,phone:o.phone,email:o.email,address:o.address,customer,supplier};if(b)Object.assign(s.businesses.find(v=>v.id===b.id),x);else s.businesses.push(x)});closeModal()};bindActs()}
function invoiceModal(i){let typ=i?.type||"incoming";modal(i?"Invoice Details":"New Invoice",'<form id="invoiceForm"><div class="grid2"><div class="field"><label>Invoice direction</label><select name="type" id="invoiceType"><option value="incoming" '+(typ==="incoming"?"selected":"")+'>Incoming · Supplier</option><option value="outgoing" '+(typ==="outgoing"?"selected":"")+'>Outgoing · Customer</option></select></div><div class="field"><label>Business</label><select name="businessId" id="invoiceBusiness">'+opts(typ==="incoming"?"supplier":"customer",i?.businessId)+'</select></div>'+field("date","Invoice date",i?.date||today(),"date")+field("dueDate","Due date",i?.dueDate||"","date")+field("number","Invoice number",i?.number)+field("amount","Amount",i?i.amount/100:"","number")+'</div>'+field("description","Description / Remarks",i?.description)+'<div class="form-actions"><button type="button" data-act="close">Cancel</button><button class="primary">Save Invoice</button></div></form>'+
(i?'<hr><div class="bar"><h2>Payment & adjustments</h2>'+btn("Add Payment","newPayment")+btn("Add CN / DN","newAdjustment")+'</div><p>Adjusted total: <b>'+fmt(total(i))+'</b> · Paid: <b>'+fmt(paid(i))+'</b> · Due: <b>'+fmt(due(i))+'</b></p>'+state.payments.filter(p=>p.allocations.some(a=>a.invoiceId===i.id)).map(p=>'<p>'+dt(p.date)+' — '+esc(p.reference)+' — '+fmt(p.allocations.filter(a=>a.invoiceId===i.id).reduce((s,a)=>s+a.amount,0))+'</p>').join("")+state.adjustments.filter(a=>a.invoiceId===i.id).map(a=>'<p>'+esc(a.kind)+' — '+esc(a.reference)+' — '+fmt(a.amount)+'</p>').join(""):''));
editing=i?.id||null;$("invoiceType").onchange=e=>{$("invoiceBusiness").innerHTML=opts(e.target.value==="incoming"?"supplier":"customer",null)};
$("invoiceForm").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target));if(!o.businessId||!o.number||!o.date||!(Number(o.amount)>0))return alert("Business, invoice number, date and positive amount are required.");let amount=cents(o.amount);if(i && amount+adj(i)<paid(i))return alert("Invoice total cannot be less than payments already allocated.");await change(s=>{let x={id:i?.id||id(),type:o.type,businessId:o.businessId,number:o.number,date:o.date,dueDate:o.dueDate,description:o.description,amount};if(i)Object.assign(s.invoices.find(v=>v.id===i.id),x);else s.invoices.push(x)});closeModal()};bindActs()}
function paymentModal(p,preselect){const chosen=preselect?state.invoices.find(i=>i.id===preselect):null,typ=p?.type||(chosen?.type==="incoming"?"outgoing":"incoming"),businessId=p?.businessId||chosen?.businessId||"",ap=p?.allocations||[];
modal(p?"Edit Payment":"Record Payment",'<form id="paymentForm"><div class="grid2"><div class="field"><label>Payment direction</label><select name="type" id="paymentType"><option value="incoming" '+(typ==="incoming"?"selected":"")+'>Received from customer</option><option value="outgoing" '+(typ==="outgoing"?"selected":"")+'>Paid to supplier</option></select></div><div class="field"><label>Business</label><select id="paymentBusiness" name="businessId"></select></div>'+field("date","Payment date",p?.date||today(),"date")+field("reference","Payment reference",p?.reference)+'</div><div class="notice">Allocate this payment across one or more outstanding invoices for the selected business. Each row is an amount applied to an invoice.</div><div id="allocations"></div><div class="actions"><button type="button" id="addAllocation">+ Add invoice allocation</button></div><div class="form-actions"><button type="button" data-act="close">Cancel</button><button class="primary">Save Payment</button></div></form>');
const ptype=$("paymentType"),pb=$("paymentBusiness"),alloc=$("allocations");function showBusiness(){let role=ptype.value==="incoming"?"customer":"supplier";pb.innerHTML=opts(role,pb.value||businessId)}function addRow(invoiceId="",amount=""){let row=document.createElement("div");row.className="grid2";let available=state.invoices.filter(i=>i.businessId===pb.value&&i.type===(ptype.value==="incoming"?"outgoing":"incoming")&&(due(i)>0||ap.some(a=>a.invoiceId===i.id)));row.innerHTML='<div class="field"><label>Invoice</label><select class="alloc-inv"><option value="">Select invoice</option>'+available.map(i=>'<option value="'+i.id+'" '+(invoiceId===i.id?"selected":"")+'>'+esc(i.number)+' · Due '+fmt(due(i))+'</option>').join("")+'</select></div><div class="field"><label>Allocated amount</label><input class="alloc-amount" type="number" step="0.01" min="0.01" value="'+esc(amount)+'"></div>';alloc.append(row)}
ptype.onchange=()=>{pb.value="";showBusiness();alloc.innerHTML="";addRow()};pb.onchange=()=>{alloc.innerHTML="";addRow()};showBusiness();if(ap.length)ap.forEach(a=>addRow(a.invoiceId,a.amount/100));else addRow(preselect,chosen?Math.max(0,due(chosen))/100:"");$("addAllocation").onclick=()=>addRow();
$("paymentForm").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),allocation=[...alloc.children].map(row=>({invoiceId:row.querySelector("select").value,amount:cents(row.querySelector("input").value)}));if(!o.businessId||!o.date||allocation.length===0||allocation.some(a=>!a.invoiceId||a.amount<=0))return alert("Enter a date, business and valid invoice allocations.");let ids=allocation.map(a=>a.invoiceId);if(new Set(ids).size!==ids.length)return alert("Select each invoice only once.");const sum=allocation.reduce((s,a)=>s+a.amount,0);for(const a of allocation){let inv=state.invoices.find(i=>i.id===a.invoiceId);if(!inv||inv.businessId!==o.businessId||inv.type!==(o.type==="incoming"?"outgoing":"incoming"))return alert("Invoice does not match business or direction.");let previous=p?.allocations.find(z=>z.invoiceId===inv.id)?.amount||0;if(a.amount>due(inv)+previous)return alert("Payment exceeds remaining balance on "+inv.number)}await change(s=>{let x={id:p?.id||id(),type:o.type,businessId:o.businessId,date:o.date,reference:o.reference,amount:sum,allocations:allocation};if(p)Object.assign(s.payments.find(v=>v.id===p.id),x);else s.payments.push(x)});closeModal()};bindActs()}
function adjustModal(invoiceId){let inv=state.invoices.find(i=>i.id===invoiceId);modal("Credit / Debit Note",'<form id="adjustForm"><div class="grid2"><div class="field"><label>Type</label><select name="kind"><option value="CN">Credit Note (reduces invoice)</option><option value="DN">Debit Note (increases invoice)</option></select></div>'+field("date","Date",today(),"date")+field("reference","CN/DN reference")+field("amount","Amount","","number")+'</div><div class="form-actions"><button class="primary">Add Adjustment</button></div></form>');$("adjustForm").onsubmit=async e=>{e.preventDefault();let o=Object.fromEntries(new FormData(e.target)),amount=cents(o.amount);if(amount<=0||!o.reference)return alert("Reference and positive amount required.");if(o.kind==="CN"&&due(inv)<amount)return alert("Credit note exceeds outstanding balance.");await change(s=>s.adjustments.push({id:id(),invoiceId,date:o.date,kind:o.kind,reference:o.reference,amount}));closeModal()}}
function getReportRows(){if(reportKind==="payment")return [["Date","Direction","Business","Reference","Amount"],...state.payments.filter(p=>month(p.date)===period).map(p=>[p.date,p.type,biz(p.businessId)?.name||"",p.reference,p.amount/100])];let arr=reportKind==="outstanding"?state.invoices.filter(i=>due(i)>0):state.invoices.filter(i=>month(i.date)===period);return [["Date","Invoice","Direction","Business","Amount","Paid","Due","Status"],...arr.map(i=>[i.date,i.number,i.type,iname(i),total(i)/100,paid(i)/100,due(i)/100,status(i)])]}
function download(name,content,mime="application/json"){const u=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement("a");a.href=u;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),60000)}
function jsonFile(name,o){download(name,JSON.stringify(o,null,2))}
function backup(){jsonFile("DocTracker-Backup-"+today()+".json",{format:"doctracker-backup",version:1,exportedAt:new Date().toISOString(),data:state});notify("Backup file prepared — verify it is saved")}
function excel(){const rows=getReportRows(),xmlEsc=s=>esc(s).replace(/'/g,"&apos;"),cells=rows.map(row=>'<Row>'+row.map(v=>'<Cell><Data ss:Type="'+(typeof v==="number"?"Number":"String")+'">'+xmlEsc(v)+'</Data></Cell>').join("")+'</Row>').join("");download("DocTracker-"+reportKind+"-"+period+".xls",'<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Worksheet ss:Name="Report"><Table>'+cells+'</Table></Worksheet></Workbook>',"application/vnd.ms-excel");notify("Excel-compatible report downloaded")}
function validData(d){return d&&d.schema===VERSION&&d.profile&&Array.isArray(d.businesses)&&Array.isArray(d.invoices)&&Array.isArray(d.payments)&&Array.isArray(d.adjustments)&&Array.isArray(d.archives)&&d.invoices.every(i=>typeof i.id==="string"&&Number.isInteger(i.amount)&&i.amount>=0)&&d.payments.every(p=>Array.isArray(p.allocations)&&p.allocations.every(a=>Number.isInteger(a.amount)&&a.amount>0))&&d.adjustments.every(a=>Number.isInteger(a.amount)&&a.amount>0)}
function readFile(handler){let f=$("file");f.value="";f.onchange=async()=>{try{if(!f.files.length)return;const obj=JSON.parse(await f.files[0].text());await handler(obj)}catch(e){alert("Import failed: "+e.message)}};f.click()}
async function restore(){readFile(async obj=>{if(obj.format!=="doctracker-backup"||!validData(obj.data))throw Error("Not a valid DocTracker backup.");if(!confirm("Replace ALL current local data with this backup? Download a current backup first."))return;await commit(obj.data);notify("Backup restored")})}
function exportInvoices(){jsonFile("DocTracker-Invoices-"+today()+".json",{format:"doctracker-export",version:1,exportedAt:new Date().toISOString(),data:{invoices:state.invoices,payments:state.payments,adjustments:state.adjustments,businesses:state.businesses}})}
function archive(){let finished=state.invoices.filter(i=>due(i)===0);if(!finished.length)return alert("No completed invoices.");let ids=new Set(finished.map(i=>i.id));let pay=state.payments.filter(p=>p.allocations.some(a=>ids.has(a.invoiceId)));if(pay.some(p=>p.allocations.some(a=>!ids.has(a.invoiceId))))return alert("Some payment receipts cover both completed and incomplete invoices. Archive those invoices together after they are settled, or retain them until later.");
let filename="DocTracker-Archive-"+today()+".json",object={format:"doctracker-archive",version:1,exportedAt:new Date().toISOString(),data:{invoices:finished,payments:pay,adjustments:state.adjustments.filter(a=>ids.has(a.invoiceId)),businesses:state.businesses}};jsonFile(filename,object);if(!confirm("Archive downloaded. Confirm the file is safely saved before deleting "+finished.length+" completed invoices and their linked entries from working data. Continue?"))return;
change(s=>{s.invoices=s.invoices.filter(i=>!ids.has(i.id));s.payments=s.payments.filter(p=>!pay.some(q=>q.id===p.id));s.adjustments=s.adjustments.filter(a=>!ids.has(a.invoiceId));s.archives.push({date:today(),filename,count:finished.length})})}
async function importArchive(){readFile(async obj=>{if(obj.format!=="doctracker-archive"||!obj.data||!Array.isArray(obj.data.invoices)||!Array.isArray(obj.data.payments)||!Array.isArray(obj.data.adjustments)||!Array.isArray(obj.data.businesses))throw Error("Invalid archive.");const src=obj.data;const ids=new Set(state.invoices.map(i=>i.id));if(src.invoices.some(i=>ids.has(i.id)))throw Error("Duplicate invoice IDs detected. Archive not imported.");if(!confirm("Import "+src.invoices.length+" archived invoices into this ledger?"))return;await change(s=>{for(let k of ["businesses","invoices","payments","adjustments"])for(let x of src[k])if(!s[k].some(v=>v.id===x.id))s[k].push(x)})})}
function bindActs(){document.querySelectorAll("[data-act]").forEach(b=>b.onclick=()=>acts[b.dataset.act]?.())}
const acts={newInvoice:()=>invoiceModal(),newBusiness:()=>businessModal(),newPayment:()=>paymentModal(),newAdjustment:()=>adjustModal(editing),close:closeModal,backup,restore,excel,print:()=>window.print(),archive,importArchive,exportInvoices,toInvoices:()=>nav("invoices")};
function bind(){bindActs();document.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>invoiceModal(state.invoices.find(i=>i.id===b.dataset.open)));document.querySelectorAll("[data-editbiz]").forEach(b=>b.onclick=()=>businessModal(state.businesses.find(i=>i.id===b.dataset.editbiz)));document.querySelectorAll("[data-editpay]").forEach(b=>b.onclick=()=>paymentModal(state.payments.find(i=>i.id===b.dataset.editpay)));if($("search"))$("search").oninput=e=>{search=e.target.value;let pos=e.target.selectionStart;render();$("search").focus();$("search").setSelectionRange(pos,pos)};if($("direction"))$("direction").onchange=e=>{direction=e.target.value;render()};if($("period"))$("period").onchange=e=>{period=e.target.value;render()};if($("reportKind"))$("reportKind").onchange=e=>{reportKind=e.target.value;render()};setupCompanyForm()}
async function start(){try{db=await openDB();const d=await readDB();if(d){if(!validData(d))throw Error("Existing local records need recovery; no writes performed.");state=d}render();if("serviceWorker"in navigator)navigator.serviceWorker.register("./sw.js").catch(()=>{});if(navigator.storage?.persist)navigator.storage.persist().catch(()=>{})}catch(e){$("app").innerHTML='<div class="panel"><h1>Storage unavailable</h1><p>'+esc(e.message)+'</p><p>DocTracker requires browser IndexedDB. No records have been overwritten.</p></div>'}}
start();
</script></body></html>
